  <body>
    <div id="root"></div>
<!-- ファーストペイント: JS 到着前に背景を描画。FCP 対策 SVG, InitialLoadingOverlay がキャンバス描画直後に除去 -->
<div id="InitialLoadingBoot" aria-hidden="true"
     style="position: fixed; inset: 0; z-index: 10000; ">
        <svg width="100%" height="100%" preserveAspectRatio="none" focusable="false" aria-hidden="true">
                <rect width="100%" height="100%" fill="oklch(75% 0 270)" />
        </svg>
</div>
<script>
        (function () {
                var boot = document.getElementById("InitialLoadingBoot");
                if (!boot) return;
                try {
                        if (window.sessionStorage.getItem("InitialLoadingViewed") === "1") {
                                boot.remove();
                                return;
                        }
                } catch (e) { }
                window.setTimeout(function () {
                        var el = document.getElementById("InitialLoadingBoot");
                        if (el) el.remove();
                }, 12000);
        })();
</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
